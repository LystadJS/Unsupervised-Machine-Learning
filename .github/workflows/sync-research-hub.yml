name: Synchronize Research Hub

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sync-research-hub.yml"
      - ".research/**"
  schedule:
    - cron: "37 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    uses: LystadJS/research-registry/.github/workflows/reusable-sync-hub.yml@main
